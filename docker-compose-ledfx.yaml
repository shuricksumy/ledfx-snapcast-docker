version: '3.9'
services:
    ledfx:
      image: ghcr.io/shuricksumy/ledfx-snapcast-docker:latest
      container_name: ledfx-pipe
      restart: unless-stopped
      # Image defaults to UID/GID 1000; override here if the host dir below is
      # owned by a different user (the mount must be writable by this UID)
      user: "1000:1000"
      security_opt:
        - no-new-privileges:true
      networks:
        npm_proxy:
            ipv4_address: $IP_LEDFX # You can specify a static IP
      ports:
        - "8889:8888" # ledfx web port
        - "8080:8080" # control panel
      environment:
        # Everything below is optional: with no environment at all, the panel
        # on :8080 starts with defaults and you configure it there.
        - ROLE=ledfx-suite
        # Panel is open to anyone who can reach the port unless this is set
        # - ADMIN_USER=admin
        # - ADMIN_PASSWORD=change-me
        # --- Snapclient Config ---
        - SNAP_HOST=192.168.111.111
        - CLIENT_ID=LedFx
        # --- Squeezelite Precise Config ---
        - SQUEEZELITE_NAME=LedFx
        - SQUEEZELITE_SERVER_PORT=192.168.111.111:3483
        - SQUEEZELITE_MAC=72:23:90:63:08:12
        - STARTUP_DELAY_SEC=0
        - SQUEEZELITE_EXTRA_ARGS=-W
        # Disable Squeezelite, keep Snapclient active
        - SQUEEZELITE_LEDFX_ENABLED=true
        - SNAPCLIENT_LEDFX_ENABLED=true
      volumes:
        # chown -R 1000:1000 $DATA_DIR/ledfx once after upgrading
        - $DATA_DIR/ledfx:/home/ledfx/.ledfx
        # Parameters edited in the panel live here. Without this mount they are
        # lost on recreate and the environment above seeds them again.
        # chown -R 1000:1000 $DATA_DIR/ledfx-config first, or the container
        # cannot write it - it runs as uid 1000.
        - $DATA_DIR/ledfx-config:/config