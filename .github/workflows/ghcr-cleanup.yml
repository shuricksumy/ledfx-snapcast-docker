name: GHCR package cleanup

# build.yml publishes exactly two kinds of tag that are meant to last: `latest`
# (newest main build) and release tags. Everything else - the short-sha tags
# from manual test builds, and untagged multi-arch leftovers - is disposable
# and gets reaped here.
#
# Docker Hub (shuricksumy/snapcast, also pushed by build.yml) is out of scope:
# different registry and API, not covered by this action.
on:
  schedule:
    # Monday 05:00 UTC, an hour after the weekly rebuild in build.yml
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview only - log what would be deleted, delete nothing'
        type: boolean
        required: false
        default: false

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old ghcr.io package versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: shuricksumy
          package: "ledfx-snapcast-docker"
          # Delete every tag except the ones below, plus orphaned untagged
          # layers. Kept: `latest`; semver release tags at any width the build
          # publishes (1, 1.0, 1.0.0, v1.0.0); and the historical
          # LFX-v<ledfx>_SC-v<snapcast> releases from before v1.0.0.
          # This action rejects a pattern whose alternatives share a prefix
          # ("ambiguous alternation") as well as nested quantifiers, so each
          # alternative below starts with a distinct character and matches all
          # widths with one character class. [0-9.]+ is deliberately loose:
          # erring wide only ever keeps a tag, it can never delete a release.
          delete-tags: ".*"
          exclude-tags: '^latest$|^v?[0-9.]+$|^LFX-v[0-9.]+_SC-v[0-9.]+$'
          use-regex: true
          delete-untagged: true
          dry-run: ${{ inputs.dry-run || false }}
          log-level: info
