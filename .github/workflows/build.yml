name: Build_Push_Scan

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write 

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '*.md'
      # Not part of the image - editing them should not republish it
      - 'docker-compose-*.yaml'
      - 'build.sh'
  release:
    types: [published]
  # Rebuild weekly so Debian security updates, a new LedFx release and a new
  # Snapcast release reach the published image without waiting for a commit
  # (paths-ignore above only applies to push events)
  schedule:
    - cron: '0 4 * * 1'
  # Rebuilds and republishes whatever the current ref implies: `latest` from
  # main, a sha tag from any other branch. Releases are cut as GitHub releases.
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # This captures the primary tag (e.g., 'latest' or the version) to pass to the scan job
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Snapcast .deb packages are pulled from the upstream release at build
      # time. Resolving the tag here (authenticated) keeps the in-build API
      # call off the anonymous rate limit and makes the version visible in the
      # build log. REFRESH_WEEK changes every ISO week so the scheduled
      # rebuild re-runs apt/pip instead of restoring a stale cache.
      - name: Resolve build inputs
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          snapcast="$(gh api repos/badaix/snapcast/releases/latest --jq .tag_name)"
          week="$(date -u +%G-W%V)"
          echo "snapcast_version=$snapcast" >> "$GITHUB_OUTPUT"
          echo "refresh_week=$week" >> "$GITHUB_OUTPUT"
          echo "Snapcast $snapcast | cache epoch $week"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            shuricksumy/snapcast
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            # A vX.Y.Z release also publishes the rolling X.Y and X tags, so
            # users can pin as loosely or as tightly as they want
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Test builds off a branch need some tag or the push fails; the
            # cleanup workflow reaps these. main and releases never get one.
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            SNAPCAST_VERSION=${{ steps.inputs.outputs.snapcast_version }}
            REFRESH_WEEK=${{ steps.inputs.outputs.refresh_week }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    # The "Scan" the workflow's own name promises -- image_tag (above) was already being
    # computed for exactly this, but nothing ever consumed it. Scans the pushed GHCR image
    # itself (base Debian packages, the snapclient/snapserver .deb files fetched from the
    # upstream release, the pip-installed ledfx package), not just source, since that's where
    # this repo's actual dependency surface lives. Public image, so no login needed to pull.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Debian carries a large backlog of CVEs it has not patched; reporting
          # them buries the ones we can actually act on (a rebuild picks up the
          # fix). Only alert on vulnerabilities that have a fixed version.
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif